- name: postfix - Ist SASL Passwortdatei bereits vorhanden?
  stat:
    path: /etc/postfix/sasl/relay_sasl_passwd
  register: stat_sasl_passwd_file

# Wir wollen das Initialisieren der SASL Credentials nur 1x am Anfang machen.
- name: postfix - Initialize SASL secret
  when: not stat_sasl_passwd_file.stat.exists
  fail:
    msg: |
      Die SASL Passwortdatei /etc/postfix/sasl/relay_sasl_passwd existiert nicht.
      Bitte erstelle diese Datei auf dem Server misumaru.
      Inhalt der Datei ist bspw.:
      [relayhost.opennet-initiative.de]:587 username:password

      Danach kann das Playbook erneut ausgeführt werden.

- name: postfix - mailname festlegen
  copy:
    content: "{{ mailserver_hostname_alias }}"
    dest: "/etc/mailname"

# TODO: Aktiviere folgenden Task nachdem alle Test der Installation erfolgreich waren und 
# - name: System-Emails an Admin-Sammleradresse versenden
#   # das Quoting ist erforderlich, um die Doppelpunkte zu schuetzen
#   lineinfile: 'dest=/etc/aliases state=present regexp="^root:" line="root: {{ admin_email }}"'
