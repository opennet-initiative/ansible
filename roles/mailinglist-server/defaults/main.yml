mailinglist_config_path: "/etc/mailman3"
mailinglist_config: "{{ mailinglist_config_path }}/mailman.cfg"
mailinglist_config_web: "{{ mailinglist_config_path }}/mailman-web.py"
mailinglist_config_archive: "{{ mailinglist_config_path }}/mailman-hyperkitty.cfg"
mailinglist_domain: "lists.opennet-initiative.de"
mailinglist_owner: "admin@{{ mailinglist_domain }}"
# Absender für System- und Weboberflächen-Mails. Muss ein gültiges,
# überwachtes Postfach sein, damit Bounces nicht ins Leere laufen.
mailinglist_from_email: "{{ mailinglist_owner }}"
mailinglist_lang: "de"
