- name: postfix installieren
  apt: pkg=postfix state=present

- name: smtp-auth-Abhaengigkeiten installieren
  apt: pkg=libsasl2-modules state=present

- name: smtp-auth-Passwort-Verzeichnis erstellen
  file:
    state: directory
    path: /etc/postfix/sasl
    owner: root
    group: root
    mode: "0755"

- name: Relay-SASL-Datei von misumaru lesen
  slurp:
    src: /etc/postfix/sasl/relay_sasl_passwd
  delegate_to: root@misumaru.opennet-initiative.de
  register: relay_sasl_passwd
  run_once: true
  no_log: true

- name: Relay-SASL-Datei schreiben
  copy:
    content: "{{ relay_sasl_passwd.content | b64decode }}"
    dest: /etc/postfix/sasl/relay_sasl_passwd
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: postmap relay_sasl_passwd

- name: Alte SASL-Passwortdatei entfernen
  file:
    path: /etc/postfix/sasl/passwd
    state: absent

- name: Alte SASL-Datenbank entfernen
  file:
    path: /etc/postfix/sasl/passwd.db
    state: absent

- name: Relay-SASL-Datenbank erzeugen
  command:
    cmd: postmap /etc/postfix/sasl/relay_sasl_passwd
    creates: /etc/postfix/sasl/relay_sasl_passwd.db
  notify: restart postfix

- name: mailname festlegen
  copy:
    content={{ mail_hostname }}
    dest=/etc/mailname

- name: System-Emails an Admin-Sammleradresse versenden
  # das Quoting ist erforderlich, um die Doppelpunkte zu schuetzen
  lineinfile: 'dest=/etc/aliases state=present regexp="^root:" line="root: {{ admin_email }}"'
  notify: newaliases
