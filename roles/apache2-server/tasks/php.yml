- name: php - Apache Modul php deaktivieren
  apache2_module:
    name: "{{ apache2_php_version }}"
    state: absent
  notify: restart apache2

# a2dismod deaktiviert mpm_prefork nicht, solange noch ein Modul davon abhängt.
# community.general < 10.6.0 errät den PHP-8-Identifier als php8_module statt
# php_module, überspringt die Deaktivierung stillschweigend und lässt php8.x.load aktiv.
- name: php - Prüfen ob mod_php noch aktiviert ist
  stat:
    path: "/etc/apache2/mods-enabled/{{ apache2_php_version }}.load"
  register: apache2_php_module_link

- name: php - Fehler wenn mod_php noch aktiviert ist
  assert:
    that: not apache2_php_module_link.stat.exists
    fail_msg: >-
      mod_php ({{ apache2_php_version }}) ist noch aktiviert, daher kann mpm_prefork
      nicht deaktiviert werden. Eine mögliche Ursache ist eine zu alte
      community.general-Collection: Auf Debian 12/13 ist Version >= 10.6.0 erforderlich.
      Installation mit:
      ansible-galaxy collection install -r collections/requirements.yml
    quiet: yes
  when: not ansible_check_mode

- name: php - Apache Modul mpm_prefork deaktivieren
  apache2_module:
    name: mpm_prefork
    state: absent
    ignore_configcheck: yes

- name: php - Apache Modul mpm_event aktivieren
  apache2_module:
    name: mpm_event
    state: present
    ignore_configcheck: yes
  notify: restart apache2

- name: php - Apache Module FPM für PHP installieren
  apt:
    name:
      - libapache2-mod-fcgid
      - "{{ apache2_php_version }}-fpm"
  when: apache2_php

- name: php - Apache Module für PHP aktivieren
  apache2_module:
    name: "{{ item }}"
    state: present
  with_items:
    - actions
    - fcgid
    - proxy_fcgi
    - alias
    - setenvif
  notify: restart apache2
  when: apache2_php

- name: php - Apache Module MODPHP für PHP bereinigen
  apt:
    name: "{{ packages }}"
    state: absent
  vars:
    packages:
      - libapache2-mod-php
      - libapache2-mod-php7.0
      - libapache2-mod-php7.3
  when: apache2_php

- name: php - Apache Konfiguration für PHP aktivieren
  command: "a2enconf {{ apache2_php_version }}-fpm"
  register: conf_php
  changed_when: "'Enabling conf' in conf_php.stdout"
  notify: restart apache2
  when: apache2_php

- name: php - APC Benutzer Puffer-Speicher aktivieren
  apt: name=php-apcu state=present
  notify: 
    - restart php-fpm
    - restart apache2
  when: apache2_php

- name: php - Dateigröße zum Hochladen setzen
  ini_file:
    path: "{{ apache2_php_dir }}/php.ini"
    section: PHP
    option: upload_max_filesize
    value: "{{ apache2_php_filesize }}"
    create: no
    backup: yes
  notify: restart php-fpm
  when: apache2_php

- name: php - POST Größe zum Hochladen setzen
  ini_file:
    path: "{{ apache2_php_dir }}/php.ini"
    section: PHP
    option: post_max_size
    value: "{{ apache2_php_filesize }}"
    create: no
    backup: yes
  notify: restart php-fpm
  when: apache2_php

# Fehler sollten nicht mehr in eine Datei geschrieben
# wir nutzen systemd-journald als Syslog-Ersatz
- name: php - Fehlermeldungen Syslog anpassen
  ini_file:
    path: "{{ apache2_php_dir }}/php-fpm.conf"
    section: global
    option: error_log
    value: syslog
    create: no
    backup: yes
  notify: restart php-fpm
  when: apache2_php and ansible_distribution_major_version|int >= 11
